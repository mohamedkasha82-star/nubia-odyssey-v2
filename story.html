<style>
:root{--ink:#120d09;--amber:#e0a458;--gold:#f3c77a;--turq:#2fb7b0;--lapis:#2a4fd6;--hib:#c2185b;--cream:#f6e7c9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--cream)}
#stage{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#2a1c10,#0c0806 70%)}
.sc{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
.sc.on{opacity:1}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;z-index:9}
.vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18vmin 6vmin rgba(0,0,0,.75);z-index:8}
.dust i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--gold);opacity:.0;animation:dust 9s linear infinite}
@keyframes dust{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-40vh) translateX(6vw);opacity:0}}
/* titles */
.big{font-family:'Reem Kufi',serif;font-weight:700;font-size:clamp(44px,13vmin,130px);color:var(--gold);text-shadow:0 0 40px rgba(243,199,122,.45);text-align:center;line-height:1.15;padding:0 6vw}
.sub{font-weight:300;font-size:clamp(16px,3.2vmin,30px);margin-top:2vh;opacity:.85;text-align:center;padding:0 8vw}
.on .big{animation:rise 3s ease both}
@keyframes rise{from{opacity:0;letter-spacing:.3em;filter:blur(8px)}to{opacity:1;letter-spacing:0;filter:blur(0)}}
/* portraits */
.pair{display:flex;gap:4vmin;align-items:flex-end;justify-content:center;width:100%;padding:0 5vw}
.port{position:relative;width:min(40vw,34vh*0.9);aspect-ratio:3/4;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(243,199,122,.5),0 20px 60px rgba(0,0,0,.7);filter:sepia(.35) contrast(1.05)}
.port img{width:100%;height:100%;object-fit:cover;display:block}
.kb .port img,.kb img.kbimg{animation:kb 14s ease-out both}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
.name{position:absolute;bottom:0;inset-inline:0;padding:2.2vh 1vw;font-family:'Reem Kufi';font-size:clamp(14px,2.8vmin,26px);text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.ph{position:absolute;inset:0;display:block}
/* river */
.river{position:absolute;inset:0;background:linear-gradient(115deg,#0c2b6b,#2a4fd6 25%,#2fb7b0 45%,#f3c77a 62%,#c2185b 80%,#4a1030);background-size:300% 300%;animation:flow 12s ease-in-out infinite alternate;opacity:.9}
@keyframes flow{to{background-position:100% 50%}}
.wave{position:absolute;left:-10%;width:120%;height:30vh;border-radius:50%;border-top:2px solid rgba(255,255,255,.35);animation:wv 6s ease-in-out infinite alternate}
@keyframes wv{to{transform:translateX(6vw) translateY(2vh)}}
/* site shots */
.shot{width:min(94vw,160vh);border-radius:14px;box-shadow:0 0 0 1px rgba(243,199,122,.35),0 30px 80px rgba(0,0,0,.8);overflow:hidden;position:relative}
.shot img{width:100%;display:block;animation:kb 12s ease-out both}
/* presenter medallions */
.med{position:absolute;bottom:13vh;width:min(20vw,16vh);aspect-ratio:1;border-radius:50%;overflow:hidden;z-index:6;box-shadow:0 0 0 2px var(--gold),0 0 40px rgba(243,199,122,.5);opacity:0;transition:opacity 1.5s}
.med img{width:100%;height:100%;object-fit:cover;filter:sepia(.3)}
.med.l{left:3vw}.med.r{right:3vw}
.showmed .med{opacity:1}
/* captions */
#cap{position:absolute;inset-inline:6vw;bottom:calc(5vh + env(safe-area-inset-bottom,0px));text-align:center;font-family:'Reem Kufi';font-size:clamp(18px,3.6vmin,34px);line-height:1.5;z-index:7;text-shadow:0 2px 14px #000;transition:opacity .8s}
/* candle */
.flame{width:7vmin;height:16vmin;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff6d6,#f3c77a 40%,#e0702a 75%,transparent 80%);filter:blur(1px);animation:fl 1.6s ease-in-out infinite alternate;box-shadow:0 0 12vmin 4vmin rgba(243,160,70,.55)}
@keyframes fl{from{transform:scale(1,.94) rotate(-1.5deg)}to{transform:scale(.95,1.06) rotate(1.5deg)}}
.wick{width:.8vmin;height:9vmin;background:#d9c7a3;margin-top:-1vmin;border-radius:2px}
#start{position:fixed;inset:0;z-index:20;background:rgba(10,6,4,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;text-align:center;padding:0 8vw}
#start button{font-family:'Reem Kufi';font-size:22px;padding:14px 38px;border-radius:40px;border:1px solid var(--gold);background:var(--amber);color:#2a1700;cursor:pointer}
#start small{opacity:.7;font-size:15px}
#ctl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:15;display:flex;gap:8px}
#ctl button{background:rgba(0,0,0,.5);color:var(--cream);border:1px solid rgba(243,199,122,.4);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<script>
const T=[ // [ثانية البدء, المشهد, النص, إظهار الميداليات]
 [0,0,"ذاكرة النيل... قبل أن تُفتح البوابة، كانت هنا وجوه تحمل الحكاية.",0],
 [7,1,"جدّي عبد الوهاب، وجدّي فتحي أحمد حسن... هما اللذان يفتحان لنا هذا الباب.",0],
 [20,2,"ومن الضوء وُلد نهر... يحمل الصور إلى أرشيف حيّ.",0],
 [28,3,"النوبة... حين يصبح التاريخ عالمًا يمكنك دخوله.",1],
 [38,4,"أثرٌ لا يقف خلف الزجاج: هرمٌ يطفو فوق النهر، بطبقات من الضوء والذاكرة.",1],
 [48,5,"اسحب الزمن نحوك: من البدايات النيلية إلى كرمة ومروي.",1],
 [58,6,"تسع وعشرون قرية، وكل قرية نجمٌ مستقل... وأندان أول المنارات.",1],
 [68,7,"واسأل آلةً تعرف حدودها: ذاكرة تستجيب، ولا تدّعي ما لا تعرف.",1],
 [77,8,"نضيء شمعة... ونترك للذاكرة صوتها.",0],
 [86,9,"النهر لا ينسى، ونحن نكتب.",0]
];
const END=96;let timers=[],sndOn=true,cur=-1;
const cap=document.getElementById('cap'),stage=document.getElementById('stage');
function speak(t){if(!sndOn||!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.82;u.pitch=.8;
 const v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ar'));
 const m=v.find(x=>/male|maged|majed|naayf|hamed/i.test(x.name));u.voice=m||v[0]||null;speechSynthesis.speak(u)}
function show(i){
 document.querySelectorAll('.sc').forEach(s=>s.classList.remove('on'));
 document.getElementById('s'+T[i][1]).classList.add('on');
 // restart ken-burns
 document.querySelectorAll('#s'+T[i][1]+' img').forEach(im=>{im.style.animation='none';im.offsetHeight;im.style.animation=''});
 stage.classList.toggle('showmed',!!T[i][3]);
 cap.style.opacity=0;setTimeout(()=>{cap.textContent=T[i][2];cap.style.opacity=1},600);
 speak(T[i][2]);cur=i}
function play(){timers.forEach(clearTimeout);timers=[];
 T.forEach((t,i)=>timers.push(setTimeout(()=>show(i),t[0]*1000)));
 timers.push(setTimeout(()=>{cap.style.opacity=0},END*1000))}
// dust
const d=document.querySelector('.dust');for(let i=0;i<26;i++){const e=document.createElement('i');e.style.left=(i*37%100)+'vw';e.style.top=(55+(i*13%40))+'vh';e.style.animationDelay=(-(i*1.7%9))+'s';d.appendChild(e)}
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';play()};
document.getElementById('rep').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();play()};
document.getElementById('snd').onclick=e=>{sndOn=!sndOn;e.target.textContent='الراوي: '+(sndOn?'تشغيل':'إيقاف');if(!sndOn)speechSynthesis.cancel()};
</script>
